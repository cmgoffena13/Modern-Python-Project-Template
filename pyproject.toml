[project]
name = "modern-python-project-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.25.1",
    "azure-keyvault-secrets>=4.10.0",
    "boto3>=1.41.5",
    "google-cloud-secret-manager>=2.25.0",
    "opentelemetry-exporter-otlp-proto-http>=1.38.0",
    "opentelemetry-sdk>=1.38.0",
    "pydantic-settings>=2.12.0",
]

[tool.pytest.ini_options]
testpaths = [ "src/tests" ]
pythonpath = [ "." ]

[tool.coverage.run]
omit = ["src/tests/*"]

[tool.coverage.report]
fail_under = 90

[tool.ruff]
target-version = "py312"
line-length = 100
force-exclude = true
lint.extend-select = [
    "A",     # Builtins
    "AIR",   # Optional: Airflow
    "FAST",  # Optional: FastApi
    "DTZ",   # Datetime
    "SIM",   # Simplify
    "I",     # Isort Imports
    "S",     # Bandit
    "PT",    # Pytest
    "B",     # BugBear
    "N",     # Naming Conventions
    "RUF",   # Ruff Specific Rules
    "PTH",   # Pathlib
    "ARG",   # Unused Args
    "C4",    # Force Current List Comprehensions
    "RET",   # Return Checks
    "E501",  # Line Too Long
    "ANN401" # No 'Any'
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S101"]  # Proper use of assert

[dependency-groups]
dev = [
    "prek>=0.3.8",
    "pytest>=9.0.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14.4",
    "ty>=0.0.26",
]
